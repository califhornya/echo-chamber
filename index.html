<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazaar Combat Simulator</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <h1>Bazaar Combat Simulator</h1>
  <div class="button-container">
    <button class="startbutton" id="start-btn">Start Combat</button>
    <button class="testbutton" id="test-basic-btn">Test Basic Combat</button>
    <button class="testbutton" id="test-aquatic-btn">Test Aquatic Combat</button>
    <button class="testbutton" id="test-multiple-btn">Test Multiple Items</button>
  </div>
  <div id="logs-container"></div>

  <script type="module" src="./main.js"></script>
  <script type="module">
    import { testBasicCombat, testAquaticCombat, testMultipleItems } from './test_combat.js';
    
    document.getElementById("test-basic-btn").addEventListener("click", testBasicCombat);
    document.getElementById("test-aquatic-btn").addEventListener("click", testAquaticCombat);
    document.getElementById("test-multiple-btn").addEventListener("click", testMultipleItems);
  </script>
</body>
</html>
